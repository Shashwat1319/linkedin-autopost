name: LinkedIn auto-post

on:
  schedule:
    # Hourly window: 02:15–17:15 UTC = 07:45–22:45 IST
    # state.json guard ensures exactly 1 post/day — first successful
    # fire of the day posts, rest skip. Single-slot miss = no lost day.
    - cron: "15 2-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish next queued post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: node post.mjs

      - name: Commit archive + state
        run: |
          git config user.name "linkedin-autopost[bot]"
          git config user.email "linkedin-autopost[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: archive posted content"
            git push
          fi
